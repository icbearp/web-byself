<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>周多福 · 内容发布工具</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#162033;background:#edf4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#d8e8ff 0,transparent 35%),#f4f8ff}.app{min-height:100vh;display:grid;grid-template-columns:320px 1fr}.sidebar{padding:24px;background:rgba(255,255,255,.88);border-right:1px solid #dce6f5;backdrop-filter:blur(20px)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#2169f5;color:#fff;font-weight:800}.brand strong,.brand small{display:block}.brand small,.muted{color:#738096}.view-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#edf3fc;border-radius:13px;padding:4px}.view-tabs button{border:0;border-radius:10px;background:transparent;padding:9px 4px;color:#637188;font-weight:700;cursor:pointer}.view-tabs button.active{background:#fff;color:#2169f5;box-shadow:0 4px 14px #b9cbe733}.new{width:100%;border:0;border-radius:14px;background:#162033;color:#fff;padding:13px;font-weight:700;cursor:pointer;margin-top:12px}.list{display:grid;gap:8px;margin-top:15px;max-height:calc(100vh - 210px);overflow:auto}.item{border:1px solid transparent;border-radius:14px;background:transparent;text-align:left;padding:12px;cursor:pointer}.item:hover,.item.active{background:#edf4ff;border-color:#cfe0ff}.item span,.item small{display:block;color:#77849a;font-size:12px}.item strong{display:block;margin:6px 0;line-height:1.4}.badge{display:inline-block!important;width:max-content;border-radius:99px;padding:3px 7px;background:#fff1cf;color:#986600!important}.main{padding:28px;overflow:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.top h1{font-size:28px;margin:0 0 6px}.top p{margin:0;color:#6f7c91}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{border:1px solid #ccdaec;border-radius:12px;background:#fff;padding:11px 15px;font-weight:700;cursor:pointer}.actions .publish{background:#2169f5;border-color:#2169f5;color:#fff}.actions .danger{color:#b64242}.editor{background:rgba(255,255,255,.92);border:1px solid #dce6f5;border-radius:24px;padding:22px;box-shadow:0 18px 60px rgba(45,83,145,.09)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field>span{font-size:13px;font-weight:700;color:#53627a}.field input,.field textarea,.field select{width:100%;border:1px solid #d5e0ef;border-radius:11px;background:#fbfdff;padding:11px 12px;font:inherit;color:inherit;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#5992ff;box-shadow:0 0 0 3px #e5efff}.drop{border:1px dashed #a9bfdc;border-radius:13px;padding:12px;background:#f5f9ff}.drop input{border:0;padding:3px;background:transparent}.hint{font-size:12px;color:#7a879a}.composer{grid-column:1/-1;border:1px solid #d5e0ef;border-radius:15px;overflow:hidden;background:#fff}.toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:9px;border-bottom:1px solid #dce6f5;background:#f5f8fd;position:sticky;top:0}.toolbar button{min-width:35px;border:1px solid #d6e0ed;border-radius:8px;background:#fff;padding:7px 9px;font-weight:700;cursor:pointer}.toolbar button:hover{border-color:#7da5ec;color:#2169f5}.composer-body{display:grid;grid-template-columns:1fr 1fr;min-height:430px}.composer textarea{border:0;border-radius:0;resize:vertical;min-height:430px;padding:18px;line-height:1.75}.preview{border-left:1px solid #dce6f5;padding:18px;overflow:auto;line-height:1.75}.preview:empty:before{content:'右侧实时预览';color:#9aa6b7}.preview h2,.preview h3{margin:20px 0 8px}.preview blockquote{border-left:3px solid #5c84e8;margin:12px 0;padding:8px 14px;background:#f2f6ff}.preview img{max-width:100%;border-radius:12px}.preview table{width:100%;border-collapse:collapse;font-size:13px}.preview th,.preview td{border:1px solid #dbe4ef;padding:8px;text-align:left}.preview th{background:#eef4ff}.status{min-height:24px;margin:15px 0 0;color:#3565a7}.status.error{color:#c13f3f}.record-only{display:none}.is-record .record-only{display:grid}.is-record .tutorial-only{display:none}@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid #dce6f5}.list{max-height:220px}.main{padding:18px}.top,.actions{display:grid}.grid,.composer-body{grid-template-columns:1fr}.field.full,.composer{grid-column:auto}.preview{border-left:0;border-top:1px solid #dce6f5}}
  </style>
</head>
<body><div class="app">
  <aside class="sidebar"><div class="brand"><span class="mark">周</span><div><strong>内容发布工具</strong><small>编辑、草稿、更新与发布</small></div></div><div class="view-tabs"><button class="active" data-view="tutorial">教程</button><button data-view="record">随心记录</button><button data-view="draft">草稿</button></div><button class="new" id="new">＋ 新建教程</button><div class="list" id="list"></div></aside>
  <main class="main"><div class="top"><div><h1 id="pageTitle">编辑生活效率教程</h1><p>Word 式工具栏 + 实时预览；内容保存为 Markdown，便于版本追踪和回滚。</p></div><div class="actions"><button class="danger" id="deleteDraft" hidden>删除草稿</button><button id="draft">保存草稿</button><button class="publish" id="publish">发布</button></div></div>
    <section class="editor" id="editor"><div class="grid">
      <label class="field"><span>标题</span><input id="title" maxlength="120" placeholder="这篇内容要解决什么问题"></label>
      <label class="field tutorial-only"><span>教程分类</span><input id="tutorialCategory" maxlength="30" placeholder="例如：内容搜集"></label>
      <label class="field record-only"><span>记录分类</span><select id="recordCategory"><option value="career-growth">职场与选择</option><option value="life-efficiency">生活效率</option><option value="side-project">锦上添花的业余</option></select></label>
      <label class="field full"><span>摘要</span><input id="summary" maxlength="300" placeholder="用一句话说明读者能得到什么"></label>
      <label class="field"><span>标签（逗号分隔）</span><input id="tags" placeholder="来源核对, 表格, 工作流"></label>
      <label class="field"><span id="dateLabel">首次发布日期</span><input id="publishedAt" type="date"></label>
      <label class="field full record-only"><span>记录结论</span><input id="takeaway" maxlength="500" placeholder="这次记录最想留下的一句话"></label>
      <label class="field full drop"><span>导入文档</span><input id="file" type="file" accept=".md,.txt,.json"><small class="hint">Markdown / TXT 会放入正文；JSON 可自动回填。Word 内容可以直接复制粘贴。</small></label>
      <section class="composer"><div class="toolbar" aria-label="正文格式工具栏">
        <button data-tool="undo" title="撤销">↶</button><button data-tool="redo" title="重做">↷</button><button data-tool="h2">标题</button><button data-tool="h3">小标题</button><button data-tool="bold"><b>B</b></button><button data-tool="quote">引用</button><button data-tool="ul">列表</button><button data-tool="ol">编号</button><button data-tool="link">链接</button><button data-tool="image">图片链接</button><button data-tool="table">多维表格</button>
      </div><div class="composer-body"><textarea id="content" placeholder="从这里开始写正文……"></textarea><article class="preview" id="preview"></article></div></section>
      <label class="field full"><span>资料来源（每行：名称 | https://链接）</span><textarea id="sources" rows="4" placeholder="官方说明 | https://example.com"></textarea></label>
    </div><p class="status" id="status"></p></section>
  </main>
</div><script>
const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));let tutorials=[],records=[],drafts=[],view='tutorial',currentId='',currentSource='new',currentType='tutorial';
const fields=['title','summary','tags','publishedAt','takeaway','content','sources'];
function items(){if(view==='draft')return drafts;return view==='record'?records:tutorials}
function isPublished(){const source=currentType==='record'?records:tutorials;return Boolean(currentId&&source.some(item=>item.id===currentId))}
function syncPublishAction(){$('publish').textContent=isPublished()?'更新':'发布'}
function reset(type=view==='record'?'record':'tutorial'){currentId='';currentSource='new';currentType=type;fields.forEach(id=>$(id).value='');$('tutorialCategory').value='';$('recordCategory').value='life-efficiency';$('publishedAt').value=new Date().toISOString().slice(0,10);$('deleteDraft').hidden=true;syncMode();renderList();renderPreview()}
function load(item,source=view==='draft'?'draft':'published'){currentId=item.id;currentSource=source;currentType=item.type||((view==='record')?'record':'tutorial');$('title').value=item.title||'';$('tutorialCategory').value=currentType==='tutorial'?(item.category||''):'';$('recordCategory').value=currentType==='record'?(item.category||'life-efficiency'):'life-efficiency';$('summary').value=item.summary||'';$('tags').value=(item.tags||[]).join(', ');$('publishedAt').value=item.publishedAt||item.date||'';$('takeaway').value=item.takeaway||'';$('content').value=item.content||(item.paragraphs||[]).join('\n\n');$('sources').value=(item.sources||[]).map(x=>x.label+' | '+x.href).join('\n');$('deleteDraft').hidden=source!=='draft';syncMode();renderList();renderPreview()}
function syncMode(){const record=currentType==='record';$('editor').classList.toggle('is-record',record);$('pageTitle').textContent=record?'编辑随心记录':'编辑生活效率教程';$('new').textContent=record?'＋ 新建随心记录':'＋ 新建教程';$('dateLabel').textContent=record?'记录日期':'首次发布日期';syncPublishAction()}
function renderList(){$('list').innerHTML=items().map(x=>`<button class="item ${x.id===currentId&&((view!=='draft')||currentSource==='draft')?'active':''}" data-id="${esc(x.id)}" data-type="${esc(x.type||view)}">${view==='draft'?'<span class="badge">草稿 · 不会上传</span>':''}<span>${esc(x.type==='record'?'随心记录':x.category||'教程')}</span><strong>${esc(x.title)}</strong><small>${view==='draft'?'保存 '+new Date(x.savedAt).toLocaleString('zh-CN'):'更新 '+esc(x.updatedAt||x.date||'')}</small></button>`).join('')||'<p class="muted">这里暂时没有内容。</p>';document.querySelectorAll('.item').forEach(b=>b.onclick=()=>load(items().find(x=>x.id===b.dataset.id),view==='draft'?'draft':'published'))}
function payload(){return{type:currentType,id:currentId,title:$('title').value,category:currentType==='record'?$('recordCategory').value:$('tutorialCategory').value,summary:$('summary').value,tags:$('tags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),publishedAt:$('publishedAt').value,date:$('publishedAt').value,takeaway:$('takeaway').value,content:$('content').value,sources:$('sources').value.split('\n').map(line=>{const [label,...rest]=line.split('|');return{label:(label||'').trim(),href:rest.join('|').trim()}}).filter(x=>x.label&&x.href)}}
async function refresh(){const r=await fetch('/api/content'),data=await r.json();tutorials=data.tutorials||[];records=data.records||[];drafts=data.drafts||[];renderList();syncPublishAction()}
async function submit(path){const status=$('status');status.className='status';status.textContent=path.includes('publish')?'正在发布并推送，请稍候…':'正在保存草稿…';document.querySelectorAll('.actions button').forEach(x=>x.disabled=true);try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload())}),data=await r.json();if(!r.ok)throw new Error(data.error||'操作失败');currentId=data.entry.id;currentSource=path.includes('draft')?'draft':'published';view=currentSource==='draft'?'draft':currentType;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));status.textContent=data.message;$('deleteDraft').hidden=currentSource!=='draft';await refresh()}catch(e){status.className='status error';status.textContent=e.message}finally{document.querySelectorAll('.actions button').forEach(x=>x.disabled=false)}}
function insert(before,after='',placeholder='文字'){const area=$('content'),start=area.selectionStart,end=area.selectionEnd,text=area.value.slice(start,end)||placeholder;area.setRangeText(before+text+after,start,end,'end');area.focus();renderPreview()}
function prefixLines(prefix){const area=$('content'),start=area.selectionStart,end=area.selectionEnd,text=area.value.slice(start,end)||'列表内容',next=text.split('\n').map((line,i)=>prefix.replace('{n}',i+1)+line).join('\n');area.setRangeText(next,start,end,'end');area.focus();renderPreview()}
function tool(action){if(action==='undo'||action==='redo'){document.execCommand(action);return renderPreview()}if(action==='h2')return insert('## ','','标题');if(action==='h3')return insert('### ','','小标题');if(action==='bold')return insert('**','**','重点文字');if(action==='quote')return prefixLines('> ');if(action==='ul')return prefixLines('- ');if(action==='ol')return prefixLines('{n}. ');if(action==='link'){const url=prompt('输入 https:// 链接');if(url&&/^https?:\/\//.test(url))insert('[',']('+url+')','链接文字');return}if(action==='image'){const url=prompt('输入图片的 https:// 链接');if(!url||!/^https?:\/\//.test(url))return;const alt=prompt('图片说明（也会作为无障碍文字）')||'图片';return insert('\n!['+alt+']('+url+')\n','','')}if(action==='table'){const names=(prompt('输入列名，用逗号分隔','项目, 状态, 来源')||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean);if(!names.length)return;const count=Math.min(20,Math.max(1,Number(prompt('需要几行数据？','3'))||3)),head='| '+names.join(' | ')+' |\n| '+names.map(()=> '---').join(' | ')+' |\n',rows=Array.from({length:count},()=> '| '+names.map(()=> '填写内容').join(' | ')+' |').join('\n');return insert('\n'+head+rows+'\n','','')}}
function inline(value){return esc(value).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank">$1 ↗</a>')}
function renderPreview(){const lines=$('content').value.split('\n'),out=[];for(let i=0;i<lines.length;i++){const line=lines[i],img=line.match(/^!\[([^\]]*)\]\((https?:\/\/[^)]+)\)$/);if(line.includes('|')&&/^\s*\|?[\s:|-]+\|/.test(lines[i+1]||'')){const cells=r=>r.replace(/^\s*\||\|\s*$/g,'').split('|').map(x=>x.trim()),heads=cells(line),rows=[];i+=2;while(i<lines.length&&lines[i].includes('|')){rows.push(cells(lines[i]));i++}i--;out.push('<table><thead><tr>'+heads.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+heads.map((_,c)=>'<td>'+inline(r[c]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue}if(!line.trim())out.push('<br>');else if(img)out.push('<figure><img src="'+esc(img[2])+'" alt="'+esc(img[1])+'"><figcaption>'+esc(img[1])+'</figcaption></figure>');else if(line.startsWith('## '))out.push('<h2>'+inline(line.slice(3))+'</h2>');else if(line.startsWith('### '))out.push('<h3>'+inline(line.slice(4))+'</h3>');else if(line.startsWith('> '))out.push('<blockquote>'+inline(line.slice(2))+'</blockquote>');else if(line.startsWith('- '))out.push('<p>• '+inline(line.slice(2))+'</p>');else out.push('<p>'+inline(line)+'</p>')}$('preview').innerHTML=out.join('')}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));if(view==='draft'){currentId='';currentSource='draft';renderList();if(drafts[0])load(drafts[0],'draft');else reset('tutorial')}else reset(view)});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>tool(b.dataset.tool));$('content').addEventListener('input',renderPreview);$('new').onclick=()=>reset(currentType);$('draft').onclick=()=>submit('/api/draft');$('publish').onclick=()=>submit('/api/publish');$('deleteDraft').onclick=async()=>{if(currentSource!=='draft')return;const r=await fetch('/api/delete-draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:currentType,id:currentId})}),data=await r.json();$('status').textContent=data.message||'';await refresh();reset(currentType)};$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;const text=await file.text();if(file.name.endsWith('.json')){try{load(JSON.parse(text),'new')}catch{$('status').textContent='JSON 格式无法读取'}}else{$('content').value=text;renderPreview()}};refresh().then(()=>tutorials[0]?load(tutorials[0],'published'):reset());
</script></body></html>
