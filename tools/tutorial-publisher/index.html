<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>周多福 · 教程发布工具</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#162033;background:#edf4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#d8e8ff 0,transparent 35%),#f4f8ff}.app{min-height:100vh;display:grid;grid-template-columns:310px 1fr}.sidebar{padding:26px;background:rgba(255,255,255,.84);border-right:1px solid #dce6f5;backdrop-filter:blur(20px)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:26px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#2169f5;color:white;font-weight:800}.brand strong,.brand small{display:block}.brand small{color:#738096;margin-top:3px}.new{width:100%;border:0;border-radius:14px;background:#162033;color:#fff;padding:13px;font-weight:700;cursor:pointer}.list{display:grid;gap:8px;margin-top:18px;max-height:calc(100vh - 170px);overflow:auto}.item{border:1px solid transparent;border-radius:14px;background:transparent;text-align:left;padding:12px;cursor:pointer}.item:hover,.item.active{background:#edf4ff;border-color:#cfe0ff}.item span,.item small{display:block;color:#77849a}.item strong{display:block;margin:6px 0}.main{padding:32px;overflow:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.top h1{font-size:28px;margin:0 0 6px}.top p{margin:0;color:#6f7c91}.actions{display:flex;gap:10px}.actions button{border:1px solid #ccdaec;border-radius:12px;background:white;padding:11px 17px;font-weight:700;cursor:pointer}.actions .publish{background:#2169f5;border-color:#2169f5;color:white}.editor{background:rgba(255,255,255,.9);border:1px solid #dce6f5;border-radius:24px;padding:24px;box-shadow:0 18px 60px rgba(45,83,145,.09)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field span{font-size:13px;font-weight:700;color:#53627a}.field input,.field textarea{width:100%;border:1px solid #d5e0ef;border-radius:12px;background:#fbfdff;padding:12px 13px;font:inherit;color:inherit;outline:none}.field input:focus,.field textarea:focus{border-color:#5992ff;box-shadow:0 0 0 3px #e5efff}.field textarea{min-height:320px;line-height:1.7;resize:vertical}.drop{border:1px dashed #a9bfdc;border-radius:14px;padding:14px;background:#f5f9ff}.drop input{border:0;padding:4px;background:transparent}.hint{font-size:12px;color:#7a879a}.status{min-height:24px;margin:16px 0 0;color:#3565a7}.status.error{color:#c13f3f}@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid #dce6f5}.list{max-height:220px}.main{padding:20px}.top,.actions{display:grid}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body><div class="app">
  <aside class="sidebar"><div class="brand"><span class="mark">周</span><div><strong>教程发布工具</strong><small>只在本机运行</small></div></div><button class="new" id="new">＋ 新建教程</button><div class="list" id="list"></div></aside>
  <main class="main"><div class="top"><div><h1>写好，检查，然后发布</h1><p>支持 Markdown、TXT 与 JSON；发布后 GitHub 和 Cloudflare 会自动衔接。</p></div><div class="actions"><button id="save">保存到本地</button><button class="publish" id="publish">发布到 GitHub</button></div></div>
    <section class="editor"><div class="grid">
      <label class="field"><span>标题</span><input id="title" maxlength="120" placeholder="教程要解决什么问题"></label>
      <label class="field"><span>分类</span><input id="category" maxlength="30" placeholder="例如：内容搜集"></label>
      <label class="field full"><span>摘要</span><input id="summary" maxlength="300" placeholder="用一句话说明读者能得到什么"></label>
      <label class="field"><span>标签（逗号分隔）</span><input id="tags" placeholder="来源核对, 表格, 工作流"></label>
      <label class="field"><span>发布日期</span><input id="publishedAt" type="date"></label>
      <label class="field full drop"><span>导入文档</span><input id="file" type="file" accept=".md,.txt,.json"><small class="hint">Markdown / TXT 会放入正文；教程 JSON 可自动回填字段。</small></label>
      <label class="field full"><span>正文（支持 ## 小标题和 - 列表）</span><textarea id="content" placeholder="## 第一步&#10;&#10;- 写清楚目标&#10;- 保存来源"></textarea></label>
      <label class="field full"><span>资料来源（每行：名称 | https://链接）</span><textarea id="sources" style="min-height:110px" placeholder="官方说明 | https://example.com"></textarea></label>
    </div><p class="status" id="status"></p></section>
  </main>
</div><script>
const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));let tutorials=[],currentId='';
const fields=['title','category','summary','tags','publishedAt','content','sources'];
function reset(){currentId='';fields.forEach(id=>$(id).value='');$('publishedAt').value=new Date().toISOString().slice(0,10);renderList()}
function load(item){currentId=item.id;$('title').value=item.title||'';$('category').value=item.category||'';$('summary').value=item.summary||'';$('tags').value=(item.tags||[]).join(', ');$('publishedAt').value=item.publishedAt||'';$('content').value=item.content||'';$('sources').value=(item.sources||[]).map(x=>x.label+' | '+x.href).join('\n');renderList()}
function renderList(){$('list').innerHTML=tutorials.map(x=>`<button class="item ${x.id===currentId?'active':''}" data-id="${esc(x.id)}"><span>${esc(x.category)}</span><strong>${esc(x.title)}</strong><small>更新 ${esc(x.updatedAt)}</small></button>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>load(tutorials.find(x=>x.id===b.dataset.id)))}
function payload(){return{id:currentId,title:$('title').value,category:$('category').value,summary:$('summary').value,tags:$('tags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),publishedAt:$('publishedAt').value,content:$('content').value,sources:$('sources').value.split('\n').map(line=>{const [label,...rest]=line.split('|');return{label:(label||'').trim(),href:rest.join('|').trim()}}).filter(x=>x.label&&x.href)}}
async function refresh(){const r=await fetch('/api/content');const data=await r.json();tutorials=data.tutorials||[];renderList()}
async function submit(path){const status=$('status');status.className='status';status.textContent=path.includes('publish')?'正在提交并推送，请稍候…':'正在保存…';document.querySelectorAll('.actions button').forEach(x=>x.disabled=true);try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload())});const data=await r.json();if(!r.ok)throw new Error(data.error||'操作失败');currentId=data.tutorial.id;status.textContent=data.message;await refresh()}catch(e){status.className='status error';status.textContent=e.message}finally{document.querySelectorAll('.actions button').forEach(x=>x.disabled=false)}}
$('new').onclick=reset;$('save').onclick=()=>submit('/api/save');$('publish').onclick=()=>submit('/api/publish');$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;const text=await file.text();if(file.name.endsWith('.json')){try{load(JSON.parse(text))}catch{$('status').textContent='JSON 格式无法读取'}}else $('content').value=text};refresh().then(()=>tutorials[0]&&load(tutorials[0]));
</script></body></html>
